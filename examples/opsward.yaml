# A minimal single-user configuration: one cluster, read-only access.
# Validate with: opsward validate --config examples/opsward.yaml

identity:
  mode: local
  principal: { subject: local-admin, groups: [admin] }

storage:
  type: sqlite
  path: /var/lib/opsward/opsward.db
  auditRetention: 90d

audit:
  stream: { type: stderr }

providers:
  kubernetes:
    clusters:
      cluster-a:
        profiles:
          # A kubeconfig whose credential is bound to a read-only role: get/list on
          # workloads, pods and events, list on namespaces, get on pods/log; no
          # secrets, pods/exec or pods/portforward.
          reader: { kubeconfig: /etc/opsward/cluster-a-reader.kubeconfig }
        # A cluster can have its own backends, used instead of the shared ones below:
        # metrics: { type: prometheus, url: https://prometheus.cluster-a.example.com }
        # logs: { type: loki, url: https://loki.cluster-a.example.com }

  # Optional query backends; their tools appear only when configured. Changing these
  # sections needs a restart.
  # metrics:
  #   type: prometheus                 # Prometheus, VictoriaMetrics, Mimir, Thanos
  #   url: https://metrics.example.com
  #   clusterLabel: cluster            # omit if the backend holds one cluster
  #   auth: { bearerTokenFile: /etc/opsward/metrics-token }
  # logs:
  #   type: loki
  #   url: https://logs.example.com

environments:
  - name: staging
    cluster: cluster-a
    namespaces: ["*"]

policy:
  roles:
    viewer: { risk: [read] }
  bindings:
    - name: admin-view
      subjects: { groups: [admin] }
      role: viewer

# Knowledge packs: the generic builtin pack, plus your own runbooks as Markdown with
# frontmatter (docs/design/0003). Changes to this file apply without a restart; after
# editing documents in a knowledge path, send SIGHUP.
knowledge:
  builtin: true
  # paths: [/etc/opsward/knowledge]
