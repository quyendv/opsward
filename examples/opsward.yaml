# A minimal single-user configuration: one cluster, read-only access.
# Validate with: opsward validate --config examples/opsward.yaml

identity:
  mode: local
  principal: { subject: local-admin, groups: [admin] }

storage:
  type: sqlite
  path: /var/lib/opsward/opsward.db
  auditRetention: 90d

audit:
  stream: { type: stderr }

providers:
  kubernetes:
    clusters:
      cluster-a:
        profiles:
          # A kubeconfig whose credential is bound to a read-only role: get/list on
          # workloads, pods and events, get on pods/log; no secrets, pods/exec or
          # pods/portforward.
          reader: { kubeconfig: /etc/opsward/cluster-a-reader.kubeconfig }

environments:
  - name: staging
    cluster: cluster-a
    namespaces: ["*"]

policy:
  roles:
    viewer: { risk: [read] }
  bindings:
    - name: admin-view
      subjects: { groups: [admin] }
      role: viewer

# Knowledge packs: the generic builtin pack, plus your own runbooks as Markdown with
# frontmatter (docs/design/0003). Changes to this file apply without a restart; after
# editing documents in a knowledge path, send SIGHUP.
knowledge:
  builtin: true
  # paths: [/etc/opsward/knowledge]
