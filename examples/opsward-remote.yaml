# A team deployment: MCP over HTTP, each person or pipeline with an API token.
# Validate with: opsward validate --config examples/opsward-remote.yaml
# Create a token with: opsward token create --config FILE --subject alice@example.com

identity:
  mode: remote
  apiTokens:
    maxTTL: 365d
  # People can also sign in through an OpenID Connect issuer whose access tokens are
  # JWTs; MCP clients discover it from this server. Needs server.http.publicURL.
  # oidc:
  #   issuer: https://id.example.com
  #   groupsClaim: groups
  #   groupsPrefix: "oidc:"
  # Internal groups. Edits apply without a restart.
  groups:
    platform: [alice@example.com]
    team-a: [bob@example.com, ci-team-a@example.com]

server:
  http:
    address: 0.0.0.0:8080
    # How clients reach this server; required with oidc.
    # publicURL: https://opsward.example.com
    # TLS is usually terminated in front of Opsward. To serve it directly:
    # tls:
    #   certFile: /etc/opsward/tls/tls.crt
    #   keyFile: /etc/opsward/tls/tls.key

storage:
  type: sqlite
  path: /var/lib/opsward/opsward.db
  # For more than one replica:
  # type: postgres
  # dsn: { file: /etc/opsward/postgres-dsn }   # or { env: OPSWARD_POSTGRES_DSN }; use sslmode=verify-full

audit:
  stream: { type: stdout }

providers:
  kubernetes:
    clusters:
      cluster-a:
        # The RBAC each profile needs for what the policy below allows:
        #   opsward rbac render --config examples/opsward-remote.yaml
        profiles:
          reader: { kubeconfig: /etc/opsward/cluster-a-reader.kubeconfig }
          operator: { kubeconfig: /etc/opsward/cluster-a-operator.kubeconfig }
  # Where Argo CD keeps its Applications: get_delivery_status reads them, and source
  # resolution finds a workload's files through them. The reader profile needs get on
  # applications.argoproj.io there (opsward rbac render includes it).
  delivery: { type: argocd, cluster: cluster-a, namespace: argocd }
  # Forges Opsward reads from and opens pull requests on, each limited to the
  # repositories it lists. The token needs read and write on their contents and pull
  # requests.
  forges:
    - name: github
      type: github            # github, gitea (also Forgejo) or gitlab
      url: https://api.github.com
      hosts: [github.com]     # repository URLs on these hosts use this forge
      token: { file: /etc/opsward/github-token }
      repositories: [example-org/gitops]

environments:
  - name: staging
    cluster: cluster-a
    # suggest (default): propose_change returns a diff. pull-request: it opens one.
    change: { strategy: pull-request }

# Workloads without an Argo CD Application can name their source with the annotation
# opsward/source: <repository>//<path>[@<revision>], or be listed here.
sourceResolution:
  # Where annotations of each environment's workloads may point, within listed repositories.
  annotationPaths:
    staging: [apps]
  static:
    - { environment: staging, namespace: team-a-api, name: api, source: "github:example-org/gitops//apps/api" }

approvals:
  ttl: 1h

# Alertmanager's alerts, investigated with diagnose_workload as the principal of the token
# Alertmanager sends (webhook_configs.http_config.authorization.credentials_file), whom
# policy must allow; see the alerts-investigate binding.
alerts:
  principal: alertmanager
  environmentLabel: cluster      # matched against environments' clusterLabelValue
  notify:
    - { type: slack, webhookURL: { file: /etc/opsward/slack-webhook-url } }

policy:
  roles:
    viewer: { risk: [read] }
    operator: { tools: [restart_workload, scale_workload] }
    proposer: { tools: [propose_change] } # resolve_source is a read
    approver: { tools: [list_approvals, decide_approval] }
    requester: { tools: [list_approvals] } # to follow one's own requests
    investigator: { tools: [diagnose_workload] }
  bindings:
    - name: platform-view-everything
      subjects: { groups: [platform] }
      role: viewer
    - name: team-a-view-own-namespaces
      subjects: { groups: [team-a] }
      role: viewer
      scope:
        namespaces: ["team-a-*"]
    # Changes in the team's namespaces need a platform engineer's approval.
    - name: team-a-operate-with-approval
      subjects: { groups: [team-a] }
      role: operator
      scope:
        namespaces: ["team-a-*"]
      effect: approve
      approvers: { groups: [platform] }
    # A pull request is reviewed where it is opened.
    - name: team-a-proposes
      subjects: { groups: [team-a] }
      role: proposer
      scope:
        namespaces: ["team-a-*"]
    - name: platform-approves
      subjects: { groups: [platform] }
      role: approver
    - name: alerts-investigate
      subjects: { users: [alertmanager] }
      role: investigator
    - name: team-a-follows-requests
      subjects: { groups: [team-a] }
      role: requester
