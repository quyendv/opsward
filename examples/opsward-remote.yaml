# A team deployment: MCP over HTTP, each person or pipeline with an API token.
# Validate with: opsward validate --config examples/opsward-remote.yaml
# Create a token with: opsward token create --config FILE --subject alice@example.com

identity:
  mode: remote
  apiTokens:
    maxTTL: 365d
  # People can also sign in through an OpenID Connect issuer whose access tokens are
  # JWTs; MCP clients discover it from this server. Needs server.http.publicURL.
  # oidc:
  #   issuer: https://id.example.com
  #   groupsClaim: groups
  #   groupsPrefix: "oidc:"
  # Internal groups. Edits apply without a restart.
  groups:
    platform: [alice@example.com]
    team-a: [bob@example.com, ci-team-a@example.com]

server:
  http:
    address: 0.0.0.0:8080
    # How clients reach this server; required with oidc.
    # publicURL: https://opsward.example.com
    # TLS is usually terminated in front of Opsward. To serve it directly:
    # tls:
    #   certFile: /etc/opsward/tls/tls.crt
    #   keyFile: /etc/opsward/tls/tls.key

storage:
  type: sqlite
  path: /var/lib/opsward/opsward.db
  # For more than one replica:
  # type: postgres
  # dsn: { file: /etc/opsward/postgres-dsn }   # or { env: OPSWARD_POSTGRES_DSN }; use sslmode=verify-full

audit:
  stream: { type: stdout }

providers:
  kubernetes:
    clusters:
      cluster-a:
        profiles:
          reader: { kubeconfig: /etc/opsward/cluster-a-reader.kubeconfig }
          # get and patch on deployments, statefulsets and daemonsets (restart, scale),
          # list on horizontalpodautoscalers; nothing else.
          operator: { kubeconfig: /etc/opsward/cluster-a-operator.kubeconfig }

environments:
  - name: staging
    cluster: cluster-a

approvals:
  ttl: 1h

policy:
  roles:
    viewer: { risk: [read] }
    operator: { tools: [restart_workload, scale_workload] }
    approver: { tools: [list_approvals, decide_approval] }
    requester: { tools: [list_approvals] } # to follow one's own requests
  bindings:
    - name: platform-view-everything
      subjects: { groups: [platform] }
      role: viewer
    - name: team-a-view-own-namespaces
      subjects: { groups: [team-a] }
      role: viewer
      scope:
        namespaces: ["team-a-*"]
    # Changes in the team's namespaces need a platform engineer's approval.
    - name: team-a-operate-with-approval
      subjects: { groups: [team-a] }
      role: operator
      scope:
        namespaces: ["team-a-*"]
      effect: approve
      approvers: { groups: [platform] }
    - name: platform-approves
      subjects: { groups: [platform] }
      role: approver
    - name: team-a-follows-requests
      subjects: { groups: [team-a] }
      role: requester
