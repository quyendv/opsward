default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged changes)
        language: system
        entry: mise exec -- gitleaks git --pre-commit --staged --redact --no-banner
        pass_filenames: false
        always_run: true

      - id: go-mod-tidy
        name: go mod tidy
        language: system
        entry: mise exec -- go mod tidy -diff
        files: (\.go|go\.mod|go\.sum)$
        pass_filenames: false

      - id: golangci-fmt
        name: golangci-lint fmt
        language: system
        entry: mise exec -- golangci-lint fmt --diff
        types: [go]
        pass_filenames: false

      - id: golangci-lint
        name: golangci-lint run
        language: system
        entry: mise exec -- golangci-lint run
        types: [go]
        pass_filenames: false

      - id: gitleaks-pre-push
        name: gitleaks (unpushed commits)
        language: system
        entry: scripts/gitleaks-pre-push.sh
        stages: [pre-push]
        pass_filenames: false
        always_run: true
