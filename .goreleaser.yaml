version: 2
project_name: opsward

builds:
  - id: opsward
    main: ./cmd/opsward
    binary: opsward
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/quyendv/opsward/internal/version.Version={{ .Version }}
      - -X github.com/quyendv/opsward/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/quyendv/opsward/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - "^test:"

release:
  github:
    owner: quyendv
    name: opsward
  draft: true
