[tools]
go = "1.27.2"
golangci-lint = "2.14.0"
gitleaks = "8.30.1"
goreleaser = "2.18.3"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
"pipx:pre-commit" = "4.7.0"

[tasks.setup]
description = "Install tools and git hooks (run once after cloning)"
run = """
mise install
pre-commit install --install-hooks --hook-type pre-commit --hook-type commit-msg --hook-type pre-push
"""

[tasks.fmt]
description = "Format Go code"
run = "golangci-lint fmt"

[tasks.lint]
description = "Lint Go code and check formatting"
run = """
golangci-lint fmt --diff
golangci-lint run
"""

[tasks.test]
description = "Run unit tests with the race detector"
run = "go test -race -count=1 ./..."

[tasks.vuln]
description = "Check dependencies for known vulnerabilities"
run = "govulncheck ./..."

[tasks.secrets]
description = "Scan the whole git history for secrets"
run = "gitleaks git --redact --no-banner"

[tasks.private-terms]
description = "Scan the whole history for terms listed in .local/private-terms.txt (skipped without it)"
run = "scripts/private-terms.sh history"

[tasks.tidy]
description = "Fail if go.mod or go.sum is not tidy"
run = "go mod tidy -diff"

[tasks.build]
description = "Build the opsward binary into ./bin"
run = "go build -trimpath -o bin/opsward ./cmd/opsward"

[tasks.snapshot]
description = "Build release artifacts locally without publishing"
run = "goreleaser release --snapshot --clean"

[tasks.check]
description = "Everything CI runs"
depends = ["tidy", "lint", "test", "vuln", "secrets", "private-terms"]
