name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: opsward
          POSTGRES_PASSWORD: opsward
          POSTGRES_DB: opsward
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opsward" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      # The Postgres store tests fail instead of skipping when the database is missing.
      OPSWARD_TEST_POSTGRES_DSN: postgres://opsward:opsward@localhost:5432/opsward?sslmode=disable
      OPSWARD_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.8
      - run: pre-commit run --all-files --show-diff-on-failure
      - run: mise run check
      - run: mise run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --build-arg VERSION=ci --build-arg COMMIT=${{ github.sha }} -t opsward:ci .
      - run: docker run --rm opsward:ci -version
